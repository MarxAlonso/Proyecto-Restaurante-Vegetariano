global
    daemon
    maxconn 65535
    stats socket /var/run/haproxy/admin.sock mode 660

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option http-server-close
    option forwardfor
    option redispatch
    retries 3
    timeout http-request 10s
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout check 10s

frontend api_frontend
    bind *:80
    bind *:443 ssl crt /etc/ssl/certs/restaurant-veg.pem 2>/dev/null || bind *:80

    stick-table type ip size 10k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }

    use_backend api_servers

    stats enable
    stats uri /haproxy-stats
    stats auth admin:admin

backend api_servers
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200

    server api-1 10.0.0.20:3001 check inter 3s fall 2 rise 2 weight 100
    server api-2 10.0.0.21:3001 check inter 3s fall 2 rise 2 weight 100
